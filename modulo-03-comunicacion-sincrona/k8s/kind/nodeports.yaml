# NodePorts fijos para curls locales vía kind extraPortMappings.
# El tráfico inter-servicio sigue usando DNS ClusterIP (catalog-service:8081, etc.).
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  type: NodePort
  selector:
    app: catalog-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  type: NodePort
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
      nodePort: 30084
    - name: grpc
      port: 9090
      targetPort: 9090
      nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: NodePort
  selector:
    app: order-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085
      nodePort: 30085
