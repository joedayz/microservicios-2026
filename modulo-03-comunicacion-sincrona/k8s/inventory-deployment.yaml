apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels:
    app: inventory-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory
          image: localhost/joedayz/inventory-service:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
              name: http
            - containerPort: 9090
              name: grpc
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  type: NodePort
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
      nodePort: 30084
    - name: grpc
      port: 9090
      targetPort: 9090
      nodePort: 30090

