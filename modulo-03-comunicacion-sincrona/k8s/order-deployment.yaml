apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order
          image: localhost/joedayz/order-service:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
              name: http
          env:
            - name: CLIENTS_CATALOG_URL
              value: http://catalog-service:8081
            - name: SPRING_GRPC_CLIENT_CHANNELS_INVENTORY_ADDRESS
              value: static://inventory-service:9090
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: NodePort
  selector:
    app: order-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085
      nodePort: 30085

