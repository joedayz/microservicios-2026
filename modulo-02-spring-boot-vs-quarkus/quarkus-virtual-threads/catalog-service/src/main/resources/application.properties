quarkus.application.name=catalog-service-quarkus-vt
quarkus.http.port=${SERVER_PORT:8085}

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:catalog-quarkus-vt;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# Virtual Threads: los endpoints anotados con @RunOnVirtualThread
# se ejecutan en un virtual thread (I/O bloqueante sin saturar el event loop).
# No hace falta property extra; la anotacion basta (Java 21+).

# Native image: H2 driver inicializa en runtime
quarkus.native.additional-build-args=--initialize-at-run-time=org.h2.Driver
