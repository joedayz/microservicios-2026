server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: catalog-service-mvc
  datasource:
    url: ${DB_URL:jdbc:h2:mem:catalog-mvc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
