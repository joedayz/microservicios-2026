server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: catalog-service-mvc-vt
  # Virtual Threads (Java 21+): Tomcat usa un VirtualThreadPerTaskExecutor
  # en lugar del pool de platform threads. El codigo del controller NO cambia.
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:h2:mem:catalog-mvc-vt;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
