apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels:
    app: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory
          image: localhost/joedayz/inventory-service-spring:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
              name: http
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:29092
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
