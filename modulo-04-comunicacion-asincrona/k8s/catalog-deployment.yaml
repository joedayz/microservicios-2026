apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels:
    app: catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog
          image: localhost/joedayz/catalog-service-spring:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:29092
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
