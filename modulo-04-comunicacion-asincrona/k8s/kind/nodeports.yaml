# NodePorts fijos para curls locales vía kind extraPortMappings.
# El tráfico inter-servicio sigue usando DNS ClusterIP (kafka:29092, catalog-service:8081, etc.).
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  type: NodePort
  selector:
    app: catalog-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  type: NodePort
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
      nodePort: 30084
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: NodePort
  selector:
    app: order-service
  ports:
    - name: http
      port: 8086
      targetPort: 8086
      nodePort: 30086
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
spec:
  type: NodePort
  selector:
    app: kafka-ui
  ports:
    - name: http
      port: 8090
      targetPort: 8080
      nodePort: 30090
