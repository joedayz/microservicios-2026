---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: modulo8/order-service-spring:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8087
          env:
            - name: INVENTORY_BASE_URL
              value: http://inventory-service:8085
            - name: FLAKY_BASE_URL
              value: http://flaky-downstream:8090
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          # startupProbe: da hasta 60s de gracia al arranque de la JVM.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 2
          # livenessProbe: SOLO reinicia si el proceso se cuelga.
          # Antipatron: incluir dependencias externas aqui.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          # readinessProbe: incluye el estado del Circuit Breaker.
          # Si el CB abre, el pod deja de recibir trafico pero no se reinicia.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8087
      targetPort: http

