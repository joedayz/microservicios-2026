global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: order-service-spring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8087']

  - job_name: inventory-service-quarkus
    metrics_path: /q/metrics
    static_configs:
      - targets: ['host.docker.internal:8085']

  - job_name: flaky-downstream-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['flaky-downstream:8090']

