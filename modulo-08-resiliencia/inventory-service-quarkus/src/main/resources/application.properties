quarkus.application.name=inventory-service-quarkus
quarkus.http.port=${SERVER_PORT:8085}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-correlation-id

# --- REST client: pricing = flaky-downstream-service ---
quarkus.rest-client.pricing-client.url=${PRICING_BASE_URL:http://localhost:8090}
quarkus.rest-client.pricing-client.connect-timeout=1000
quarkus.rest-client.pricing-client.read-timeout=5000

# --- SmallRye Health paths ---
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.liveness-path=/q/health/live
quarkus.smallrye-health.readiness-path=/q/health/ready
quarkus.smallrye-health.startup-path=/q/health/started

# --- Micrometer Prometheus ---
quarkus.micrometer.export.prometheus.path=/q/metrics

# --- SmallRye Fault Tolerance metrics ---
quarkus.fault-tolerance.metrics.enabled=true

quarkus.log.category."pe.joedayz.microservicios.resilience.inventory".level=INFO

