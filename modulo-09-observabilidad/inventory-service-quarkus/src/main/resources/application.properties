quarkus.application.name=inventory-service-quarkus
quarkus.http.port=${SERVER_PORT:8085}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-correlation-id,x-tenant-id,traceparent,tracestate,baggage

# --- REST client: pricing = flaky-downstream-service (el mismo del modulo 8) ---
quarkus.rest-client.pricing-client.url=${PRICING_BASE_URL:http://localhost:8090}
quarkus.rest-client.pricing-client.connect-timeout=1000
quarkus.rest-client.pricing-client.read-timeout=5000

# --- SmallRye Health ---
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.liveness-path=/q/health/live
quarkus.smallrye-health.readiness-path=/q/health/ready
quarkus.smallrye-health.startup-path=/q/health/started

# --- Metricas pull. Prometheus las scrapea en /q/metrics ---
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.binder.http-server.enabled=true
quarkus.fault-tolerance.metrics.enabled=true

# --- OpenTelemetry: trazas y logs por OTLP. Metricas se quedan en Prometheus. ---
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.traces.enabled=true
quarkus.otel.logs.enabled=true
quarkus.otel.metrics.enabled=false
quarkus.otel.propagators=tracecontext,baggage
quarkus.otel.traces.sampler=parentbased_always_on
quarkus.otel.traces.suppress-non-application-uris=true
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.blrp.schedule.delay=1s
quarkus.otel.resource.attributes=service.namespace=ecommerce,deployment.environment=local

quarkus.log.console.format=%d{HH:mm:ss} %-5p [%X{traceId}/%X{spanId} tenant=%X{tenant.id}] [%c{2.}] (%t) %s%e%n
quarkus.log.category."pe.joedayz.microservicios.observability.inventory".level=INFO
