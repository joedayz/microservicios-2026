quarkus.application.name=inventory-service-quarkus
quarkus.http.port=${SERVER_PORT:8084}

# --- OIDC: Keycloak valida los JWT de la API publica ---
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/joedayz-microservices}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:inventory-service}
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=${OIDC_ISSUER:http://localhost:8180/realms/joedayz-microservices}

# La API publica exige token; la interna se protege por mTLS + policy propia.
quarkus.http.auth.permission.public-api.paths=/api/*
quarkus.http.auth.permission.public-api.policy=authenticated
quarkus.http.auth.permission.internal-api.paths=/internal/*,/q/health/*
quarkus.http.auth.permission.internal-api.policy=permit

module6.internal.expected-client-id=${INTERNAL_EXPECTED_CLIENT_ID:order-service-mtls-client}

# --- Perfil mtls: expone tambien HTTPS con autenticacion mutua ---
%mtls.quarkus.http.ssl-port=${SERVER_TLS_PORT:8444}
%mtls.quarkus.http.insecure-requests=enabled
%mtls.quarkus.http.ssl.certificate.key-store-file=${INVENTORY_TLS_KEYSTORE_PATH:../certs/inventory-service.p12}
%mtls.quarkus.http.ssl.certificate.key-store-password=${INVENTORY_TLS_KEYSTORE_PASSWORD:changeit}
%mtls.quarkus.http.ssl.certificate.trust-store-file=${INVENTORY_TLS_TRUSTSTORE_PATH:../certs/platform-truststore.p12}
%mtls.quarkus.http.ssl.certificate.trust-store-password=${INVENTORY_TLS_TRUSTSTORE_PASSWORD:changeit}
%mtls.quarkus.http.ssl.client-auth=required

# --- Tests: no dependen de un Keycloak real ---
%test.quarkus.oidc.enabled=false

quarkus.log.category."pe.joedayz.microservicios.security.inventory".level=INFO
